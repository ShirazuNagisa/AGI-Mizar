[package]
name = "agi-mizar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Mizar v1 server: pairing, devices, and the phone-facing WebSocket, served from the desktop."

[dependencies]
agi-protocol = { workspace = true }
agi-engine = { workspace = true }
agi-core = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
if-addrs = "0.13"
qrcode = { version = "0.14", features = ["svg"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
base64 = "0.22"
tempfile = { workspace = true }
