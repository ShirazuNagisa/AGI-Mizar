[package]
name = "agi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The window: a Tauri shell around the same kernel the daemon runs."

[[bin]]
name = "agi-mizar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agi-boot = { workspace = true }
agi-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSAppearance", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
libc = "0.2"
