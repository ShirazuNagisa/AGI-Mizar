name: Release

# A tag is the release. The version in the tag has to match the bundle's, or the
# updater will offer an older build forever — the check below refuses that.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: universal bundle
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the bundle
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      # A release must ship updater artifacts: bundle.createUpdaterArtifacts is
      # true, so the bundler fails once the bundles are written if the key is
      # missing, and latest.json has no signatures to name. Fail here instead,
      # with a sentence somebody can act on.
      - name: Check the updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured for this repository. Without it the release has no signed updater artifacts and latest.json cannot be produced — see docs/release.md."
            exit 1
          fi

      # The Apple certificate is what makes the .dmg openable on a stranger's Mac.
      # When the secret is absent GitHub still defines the variable, and Tauri
      # then runs `security import` on an empty string: the job spends twenty
      # minutes building and dies with "Unable to decode the provided data",
      # which says nothing about what to fix. Fail here instead.
      - name: Check the Apple signing certificate is configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          [[ -n "${APPLE_CERTIFICATE:-}" ]] || missing+=("APPLE_CERTIFICATE")
          [[ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Apple signing is not configured (missing: ${missing[*]}). The macOS bundle would be unsigned and Gatekeeper would refuse it. Set the Developer ID Application .p12 (base64) and its password as repository secrets — see docs/release.md."
            exit 1
          fi

      # The hook shim ships beside the app: the installer writes its absolute
      # path into ~/.claude/settings.json, so it has to exist in the bundle.
      # The app bundle is universal, so the shim is lipo'd from both slices — an
      # arm64-only nested binary would run on Apple Silicon and fail on Intel.
      # It is staged under the same name package.sh uses (no .exe on macOS) and
      # handed to the bundler with --config below; macOS keeps the --config
      # injection while Windows uses tauri.windows.conf.json.
      - name: Build the hook shim
        run: |
          cargo build --release -p agi-hook-shim --target aarch64-apple-darwin
          cargo build --release -p agi-hook-shim --target x86_64-apple-darwin
          mkdir -p crates/agi-app/resources
          lipo -create -output crates/agi-app/resources/agi-mizar-hook \
            target/aarch64-apple-darwin/release/agi-mizar-hook \
            target/x86_64-apple-darwin/release/agi-mizar-hook
          chmod +x crates/agi-app/resources/agi-mizar-hook

      # The model runtime the app ships. scripts/fetch-llama.sh supports macOS:
      # it downloads the pinned arm64 and x64 archives, lipos them into one
      # universal resources/bin and ad-hoc signs the Mach-O files. Without this
      # the GitHub build cannot run the model, which package.sh has always
      # staged for local builds.
      #
      # Caveat: package.sh re-signs every dylib and the runner with the Developer
      # ID after the bundler runs (the bundler does not sign Resources/), and
      # tauri-action has no hook for that. The files here stay ad-hoc signed, so
      # a *notarized* macOS release must sign them before the app is packed —
      # see docs/release.md.
      - name: Fetch the pinned llama.cpp runtime
        run: ./scripts/fetch-llama.sh

      # The remote-agent sidecar is the MCP/CLI bridge behind the settings
      # page's install entry. It has to be inside the signed bundle, not a path
      # in a target directory. Universal app, universal sidecar.
      - name: Build and stage the remote-agent sidecar
        run: |
          cargo build --release -p agi-remote --target aarch64-apple-darwin
          cargo build --release -p agi-remote --target x86_64-apple-darwin
          mkdir -p crates/agi-app/resources/bin
          lipo -create -output crates/agi-app/resources/bin/agi-remote \
            target/aarch64-apple-darwin/release/agi-remote \
            target/x86_64-apple-darwin/release/agi-remote
          chmod +x crates/agi-app/resources/bin/agi-remote

      # Notarization is optional and this project does not do it. But GitHub
      # defines a missing secret as an empty string, and Tauri treats "the
      # variable exists" as "notarization is configured": the v0.2.0 run died
      # with "Team ID must be at least 3 characters" after a successful
      # codesign. Export them only when all three are actually present.
      - name: Export notarization variables only when configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            {
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "$GITHUB_ENV"
            echo "notarization: enabled (all three Apple ID values are configured)"
          else
            echo "notarization: off (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are not all configured)"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AGI Mizar ${{ github.ref_name }}"
          releaseBody: "See the commits in this tag."
          releaseDraft: true
          prerelease: false
          # latest.json names every platform at once, so the per-platform files
          # tauri-action would upload here are not used: the updater-json job
          # below merges both jobs' signatures into one document. The .sig
          # files are still produced (and uploaded as release assets).
          uploadUpdaterJson: false
          # Both resources are staged above, so naming resources/bin is safe
          # here (it is what makes this bundle run the model).
          args: --target universal-apple-darwin --config '{"bundle":{"resources":{"resources/agi-mizar-hook":"agi-mizar-hook","resources/bin":"bin"}}}'

      # The .sig file is what the merged latest.json embeds; keep it (and a
      # small manifest naming the platform keys and the asset it belongs to)
      # for the updater-json job.
      - name: Stage the updater signature
        run: |
          set -euo pipefail
          sig="$(find target -name '*.app.tar.gz.sig' -print -quit)"
          if [[ -z "$sig" ]]; then
            echo "::error::no *.app.tar.gz.sig under target: the bundle was not signed. Is TAURI_SIGNING_PRIVATE_KEY valid?"
            exit 1
          fi
          name="$(basename "$sig")"
          asset="${name%.sig}"
          mkdir -p updater-artifacts
          cp "$sig" "updater-artifacts/$name"
          cat > updater-artifacts/updater-manifest.json <<JSON
          {
            "platforms": [
              {"key": "darwin-aarch64", "sig": "$name", "asset": "$asset", "match": "*.app.tar.gz"},
              {"key": "darwin-x86_64", "sig": "$name", "asset": "$asset", "match": "*.app.tar.gz"}
            ]
          }
          JSON
          echo "updater signature: $sig"

      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: updater-artifacts
          if-no-files-found: error

  windows:
    name: nsis installer
    # Sequential rather than parallel on purpose: both jobs hand the same tag
    # to tauri-action, and letting the macOS job create the draft release first
    # removes the create-release race between the two runners.
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the bundle
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne $tag) {
            Write-Error "tag $env:GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          }

      - name: Check the updater signing key is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error 'TAURI_SIGNING_PRIVATE_KEY is not configured for this repository. Without it the release has no signed updater artifacts and latest.json cannot be produced — see docs/release.md.'
            exit 1
          }

      # The hook shim ships beside the app: the installer writes its absolute
      # path into %USERPROFILE%\.claude\settings.json, so it has to exist in the
      # bundle. Staging it as the resource tauri.windows.conf.json names is what
      # puts it there on Windows.
      - name: Build the hook shim
        run: cargo build --release -p agi-hook-shim

      - name: Stage the hook shim as a bundle resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/agi-app/resources | Out-Null
          Copy-Item target/release/agi-mizar-hook.exe crates/agi-app/resources/agi-mizar-hook.exe

      # The remote-agent sidecar is the MCP/CLI bridge behind the settings
      # page's install entry. tauri.windows.conf.json maps resources/bin to
      # `bin/` next to the app, which is where find_remote_installer looks;
      # without this step a released installer can only report
      # REMOTE_INSTALLER_MISSING.
      - name: Build the remote-agent sidecar
        run: cargo build --release -p agi-remote

      - name: Stage the remote-agent sidecar as a bundle resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/agi-app/resources/bin | Out-Null
          Copy-Item target/release/agi-remote.exe crates/agi-app/resources/bin/agi-remote.exe

      # Pinned tag + SHA256, same file the macOS release reads. The Windows
      # build of llama-server.exe needs its DLLs from the same directory, which
      # is why the whole archive directory is installed, not just the exe.
      - name: Fetch the pinned llama.cpp runtime
        shell: pwsh
        run: ./scripts/fetch-llama.ps1

      # tauri-bundler fetches the NSIS toolset itself into
      # %LOCALAPPDATA%\tauri\NSIS (nsis-3.13.zip + nsis_tauri_utils.dll, both
      # SHA1-checked in the bundler). If that download ever becomes flaky the
      # fix is to pre-seed that directory, see docs/windows.md.
      #
      # Authenticode signing is optional and comes from the release owner, not
      # from this repository. Two ways in:
      #
      #   WINDOWS_CERTIFICATE_BASE64   base64 of a .pfx with the code-signing
      #   WINDOWS_CERTIFICATE_PASSWORD its password
      #       -> imported into the runner's CurrentUser\My store below; the
      #          thumbprint is handed to tauri-bundler, which signs the app
      #          binary and the NSIS installer with signtool.
      #
      #   WINDOWS_THUMBPRINT           SHA1 thumbprint of a certificate already
      #                                present in the store (custom runner).
      #
      # No secrets -> the installer stays unsigned and SmartScreen warns; the
      # release itself still works. A certificate alone is not enough for
      # SmartScreen to stay quiet: it must be CA-issued and the binary needs
      # download reputation (see docs/windows.md).
      #
      # `secrets` is not an allowed context in `if:`, so the presence of the
      # secrets is turned into two env flags by a normal step and the later
      # steps test those.
      - name: Detect the optional code-signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CERT_THUMBPRINT: ${{ secrets.WINDOWS_THUMBPRINT }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:CERT_BASE64)
          $hasThumbprint = -not [string]::IsNullOrWhiteSpace($env:CERT_THUMBPRINT)
          "HAS_WINDOWS_CERT=$($hasCert.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HAS_WINDOWS_THUMBPRINT=$($hasThumbprint.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($hasCert) {
            Write-Host 'code signing: importing the WINDOWS_CERTIFICATE_BASE64 certificate'
          } elseif ($hasThumbprint) {
            Write-Host 'code signing: using the pre-installed WINDOWS_THUMBPRINT certificate'
          } else {
            Write-Host 'code signing: no certificate secrets; the installer stays unsigned (SmartScreen warns)'
          }

      - name: Import the code-signing certificate (optional)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'agi-mizar-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -AsPlainText -Force
          try {
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          [System.IO.File]::WriteAllText($path, ($config | ConvertTo-Json -Depth 6 -Compress))
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SIGNING_CONFIG=$path`n")
          Write-Host "imported code-signing certificate $($cert.Thumbprint)"

      - name: Use a pre-installed code-signing certificate (optional)
        if: env.HAS_WINDOWS_CERT != 'true' && env.HAS_WINDOWS_THUMBPRINT == 'true'
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ secrets.WINDOWS_THUMBPRINT }}
        run: |
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $env:CERT_THUMBPRINT
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          [System.IO.File]::WriteAllText($path, ($config | ConvertTo-Json -Depth 6 -Compress))
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SIGNING_CONFIG=$path`n")
          Write-Host "using pre-installed code-signing certificate $env:CERT_THUMBPRINT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AGI Mizar ${{ github.ref_name }}"
          releaseBody: "See the commits in this tag."
          releaseDraft: true
          prerelease: false
          # The merged manifest is written by the updater-json job; a
          # per-platform latest.json here would be overwritten by the other job.
          uploadUpdaterJson: false
          args: ${{ env.SIGNING_CONFIG != '' && format('--bundles nsis --config {0}', env.SIGNING_CONFIG) || '--bundles nsis' }}

      # The NSIS setup.exe's .sig is what the merged latest.json embeds.
      - name: Stage the updater signature
        shell: pwsh
        run: |
          $sig = Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe.sig' -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $sig) {
            Write-Error 'no *-setup.exe.sig under target/release/bundle/nsis: the installer was not signed. Is TAURI_SIGNING_PRIVATE_KEY valid?'
            exit 1
          }
          New-Item -ItemType Directory -Force updater-artifacts | Out-Null
          Copy-Item -LiteralPath $sig.FullName -Destination (Join-Path updater-artifacts $sig.Name)
          $manifest = @{
            platforms = @(
              @{
                key = 'windows-x86_64'
                sig = $sig.Name
                asset = ($sig.Name -replace '\.sig$', '')
                match = '*-setup.exe'
              }
            )
          }
          # .NET write keeps the file BOM-free: the merge job's JSON.parse does
          # not strip a UTF-8 BOM.
          $manifestPath = Join-Path (Resolve-Path updater-artifacts).Path 'updater-manifest.json'
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 5))
          Write-Host "updater signature: $($sig.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: updater-artifacts
          if-no-files-found: error

  # One latest.json for the whole release. tauri-action writes a per-platform
  # file (and the two jobs would overwrite each other's), so both jobs hand
  # their signature to this job. The URL is built from the tag, not read from
  # the draft release: a draft's assets are reported under
  # /releases/download/untagged-<hash>/, and those URLs 404 once the release is
  # published (v0.2.0 shipped exactly that way and needed a manual re-upload).
  # scripts/updater-json.mjs normalises the asset name the same way GitHub does
  # (spaces and brackets become dots), so the built URL is the real one.
  updater-json:
    name: merged latest.json
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater

      - name: Build the merged latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/updater-json.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --out latest.json \
            --manifest updater/updater-macos/updater-manifest.json \
            --manifest updater/updater-windows/updater-manifest.json
          cat latest.json

      - name: Upload latest.json to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json
          if-no-files-found: error
