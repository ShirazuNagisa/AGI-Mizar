name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: kernel
    # macOS, not Ubuntu: this application builds a Tauri window, and a Linux
    # runner would need a webkit toolchain installed to compile one. The kernel
    # itself is portable; the shell is what makes the runner expensive.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  windows:
    name: kernel (windows)
    # A real Windows runner, because Windows is a shipped platform: the Tauri
    # shell, its NSIS bundle and the sidecar lookup only compile there.
    # `cargo fmt --check` is deliberately not a step here: the tree has rustfmt
    # drift between platforms that is being fixed separately, and this job
    # exists to cover Windows behaviour, not to reformat the workspace.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build validates bundle.resources while compiling agi-app, so the
      # source paths named by tauri.windows.conf.json must exist even for
      # clippy and tests. This job builds no installer, so stubbing them is
      # enough; the release job fetches the real runtime.
      - name: Stub the generated bundle resources
        shell: pwsh
        run: ./scripts/fetch-llama.ps1 -Stub

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  ui:
    name: window
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The build output is committed so a clone can `cargo build` without Node.
      # That only holds if the committed output matches the source.
      - name: The committed build matches the source
        run: git diff --exit-code -- ui/dist
