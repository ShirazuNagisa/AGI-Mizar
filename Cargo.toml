[workspace]
members = [
    "crates/agi-protocol",
    "crates/agi-engine",
    "crates/agi-engine-dsh",
    "crates/agi-engine-codex",
    "crates/agi-engine-claude",
    "crates/agi-hook-shim",
    "crates/agi-mizar",
    "crates/agi-boot",
    "crates/agi-app",
    "crates/agi-core",
    "crates/agi-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/ShirazuNagisa/AGI-Mizar"

[workspace.dependencies]
agi-protocol = { path = "crates/agi-protocol" }
agi-engine = { path = "crates/agi-engine" }
agi-engine-dsh = { path = "crates/agi-engine-dsh" }
agi-engine-codex = { path = "crates/agi-engine-codex" }
agi-engine-claude = { path = "crates/agi-engine-claude" }
agi-mizar = { path = "crates/agi-mizar" }
agi-boot = { path = "crates/agi-boot" }
agi-core = { path = "crates/agi-core" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
