<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AGI Mizar</title>
    <script>
      // Paint the right background before any module loads: the theme is in the
      // URL because the kernel's port, and so this page's origin, changes on
      // every launch.
      (function () {
        var query = new URLSearchParams(location.search)
        var choice = query.get('theme')
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = choice === 'dark' || (choice !== 'light' && systemDark)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'

        // The platform is in the URL for the same reason: the page reserves a
        // strip at the top on macOS (its traffic lights overlay it) and on
        // Windows (it draws its own three buttons there), while Linux keeps the
        // system title bar; the sidebar must not flash the other layout before
        // the kernel answers.
        var platform = query.get('platform')
        if (platform !== 'macos' && platform !== 'windows' && platform !== 'linux') {
          platform = /Windows/.test(navigator.userAgent)
            ? 'windows'
            : /Macintosh|Mac OS X/.test(navigator.userAgent)
              ? 'macos'
              : 'linux'
        }
        document.documentElement.dataset.platform = platform
      })()
    </script>
